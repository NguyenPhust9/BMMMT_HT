name: securepay_lab

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securepay_lab}
      POSTGRES_USER: ${POSTGRES_USER:-securepay_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepay_local_dev_pw}
    volumes:
      - securepay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securepay_user} -d ${POSTGRES_DB:-securepay_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-secret-key-change-in-env-1234567890}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000,https://127.0.0.1:8443,https://localhost:8443
      SECUREPAY_HTTPS_PROFILE: ${SECUREPAY_HTTPS_PROFILE:-False}
      POSTGRES_DB: ${POSTGRES_DB:-securepay_lab}
      POSTGRES_USER: ${POSTGRES_USER:-securepay_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepay_local_dev_pw}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal_net

  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - securepay_caddy_data:/data
      - securepay_caddy_config:/config
    networks:
      - internal_net

volumes:
  securepay_pgdata:
    name: securepay_lab_pgdata
  securepay_caddy_data:
    name: securepay_lab_caddy_data
  securepay_caddy_config:
    name: securepay_lab_caddy_config

networks:
  internal_net:
    driver: bridge

