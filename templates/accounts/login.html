{% extends "base.html" %}
{% block title %}Đăng nhập — SecurePay{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-icon"><i class="fa-solid fa-lock"></i></div>
  <h1>Đăng nhập</h1>
  <p>Nhập thông tin tài khoản để tiếp tục.</p>
  <form method="post" action="/auth/login" id="login-form">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_username">Tên đăng nhập</label>
      <input type="text" name="username" id="id_username" class="form-control" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="id_password">Mật khẩu</label>
      <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="btn-login-submit">Đăng nhập</button>
  </form>
</div>
{% endblock %}
